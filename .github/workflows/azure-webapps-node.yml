# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Greencon-Start

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        run: |
          npm ci
          npm run build
          npm run test --if-present
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          node -e "const p = require('./.next/standalone/package.json'); p.scripts.start = 'node server.js'; require('fs').writeFileSync('./.next/standalone/package.json', JSON.stringify(p, null, 2));"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0FCDFF5F0EBF425C9B1892D59D0B85B7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_6E9644033DD04EABBA16376A970F13AB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D18DF7030CB46DBBF42F76A2B0621B9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Greencon-Start'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'
